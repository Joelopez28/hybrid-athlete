name: taskflow-full

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskflow}
      POSTGRES_USER: ${POSTGRES_USER:-taskflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskflow}
    volumes:
      - taskflow-full-db:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskflow} -d ${POSTGRES_DB:-taskflow}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  postgrest:
    image: postgrest/postgrest:v12.2.3
    environment:
      PGRST_DB_URI: postgres://authenticator:authenticator-dev-password@db:5432/${POSTGRES_DB:-taskflow}
      PGRST_DB_SCHEMAS: api
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_SERVER_PORT: 3000
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET:-dev-only-secret-change-me-please-32chars}
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    environment:
      POSTGREST_URL: http://postgrest:3000
      CORS_ALLOWED_ORIGINS: http://localhost:8081
    depends_on:
      postgrest:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  taskflow-full-db:
