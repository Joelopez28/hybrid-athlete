server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ruky-backend
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  postgrest:
    base-url: ${POSTGREST_URL:http://localhost:3000}
    connect-timeout: 2s
    read-timeout: 8s
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    secret: ${PGRST_JWT_SECRET:dev-only-secret-change-me-please-32chars}
    ttl: ${JWT_TTL:12h}

logging:
  level:
    root: INFO
    com.ruky.training: INFO
